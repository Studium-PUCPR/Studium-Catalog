apiVersion: v1
kind: Namespace
metadata:
  name: studium
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studium-catalog-config
  namespace: studium
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  AWS__Region: "us-east-2"
  RabbitMQ__ConnectionString: "amqp://studium:StudiumRabbitMQ2026!@studium-rabbitmq-service.studium.svc.cluster.local:5672"
  RabbitMQ__BookingQueueName: "studium-booking-events-queue"
  RabbitMQ__AuditQueueName: "studium-audit-events-queue"
  RabbitMQ__NotificationsQueueName: "studium-notifications-queue"
  Catalog__TimeZone: "America/Sao_Paulo"
  Cors__AllowedOrigins: "*"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studium-catalog
  namespace: studium
  labels:
    app: studium-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studium-catalog
  template:
    metadata:
      labels:
        app: studium-catalog
    spec:
      containers:
        - name: studium-catalog
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: studium-catalog-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: studium-catalog-secrets
                  key: DefaultConnection
            - name: AWS__Cognito__Authority
              valueFrom:
                secretKeyRef:
                  name: studium-catalog-secrets
                  key: CognitoAuthority
            - name: AWS__Cognito__ClientId
              valueFrom:
                secretKeyRef:
                  name: studium-catalog-secrets
                  key: CognitoClientId
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: studium-catalog-secrets
                  key: AwsAccessKeyId
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: studium-catalog-secrets
                  key: AwsSecretAccessKey
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: studium-catalog-service
  namespace: studium
  labels:
    app: studium-catalog
spec:
  type: ClusterIP
  selector:
    app: studium-catalog
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: studium-catalog-hpa
  namespace: studium
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: studium-catalog
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
